# Nginx site for the city546 API on a VPS.
#   sudo cp deploy/nginx-city546.conf /etc/nginx/sites-available/city546
#   (replace API_DOMAIN below with your API hostname, e.g. api.example.com)
#   sudo ln -s /etc/nginx/sites-available/city546 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d API_DOMAIN      # adds HTTPS + auto-renewal
server {
    listen 80;
    server_name API_DOMAIN;

    # A bit above MAX_UPLOAD_MB (8 MB) so image uploads aren't cut off by Nginx.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI generation can take a while (AI_TIMEOUT_MS defaults to 180 s).
        proxy_read_timeout 200s;
    }
}
